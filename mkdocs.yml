# Project information
site_name: PGSync
site_url: https://pgsync.com
site_author: Tolu Aina
site_description: >-
  PGSync simplifies your data pipeline by integrating Postgres/MySQL/MariaDB into Elasticsearch/OpenSearch.

# Repository
repo_name: toluaina/pgsync
repo_url: https://github.com/toluaina/pgsync
edit_uri: ""

# Copyright
copyright: Copyright &copy; 2026 Tolu Aina &middot; <a href="/terms/">Terms</a> &middot; <a href="/privacy/">Privacy</a>

# Configuration
theme:
  name: material
  variant: classic
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - search.highlight
    - search.share
    - search.suggest
  font:
    text: Inter
    code: JetBrains Mono
  favicon: assets/images/favicon.svg
  logo: assets/images/pgsync-wordmark.svg
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - admonition
  - abbr
  - def_list
  - footnotes
  - tables
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Customization
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/toluaina/pgsync
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pgsync/
      name: PyPI
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/toluaina1/pgsync
      name: Docker Hub
    - icon: fontawesome/brands/digital-ocean
      link: https://marketplace.digitalocean.com/apps/pgsync?utm_medium=opensource&utm_source=pgsync
      name: DigitalOcean Marketplace
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/pgsync
      name: Twitter
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/pgsync/
      name: LinkedIn
    - icon: fontawesome/brands/medium
      link: https://medium.com/@toluaina/real-time-integration-of-postgresql-with-elasticsearch-with-pgsync-9425ffa9b4e9
      name: Medium

extra_css:
- css/termynal.css
- css/custom.css
- css/graphite.css
extra_javascript:
- js/termynal.js
- js/custom.js
- js/mail.js

